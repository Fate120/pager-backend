<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tiket Pesanan - Digital Pager</title>
  <style>
    :root {
      --bg-cream: #F4F4F0;
      --card-white: #FFFFFF;
      --border-black: #000000;
      --text-black: #0F172A;
      --text-gray: #64748B;
      --primary-blue: #1E60EC;
      --primary-yellow: #FFCC00;
      --green-ready: #10B981;
      --green-bg: #D2F8D2;
      --red-alert: #DC2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-cream);
      color: var(--text-black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; margin: auto 0; }
    .ticket-card {
      background: var(--card-white);
      border: 3px solid var(--border-black);
      box-shadow: 5px 5px 0 var(--border-black);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .queue-number-box { background: var(--primary-yellow); border: 3px solid var(--border-black); padding: 24px; text-align: center; }
    .queue-number { font-size: 56px; font-weight: 900; color: var(--text-black); line-height: 1; letter-spacing: -0.02em; }
    .queue-subtitle { font-size: 16px; font-weight: 500; color: var(--text-black); margin-top: 8px; }
    .status-bar { background: var(--primary-blue); border: 3px solid var(--border-black); padding: 12px 16px; color: #FFF; font-weight: 600; font-size: 16px; text-align: center; }
    .status-bar.ready { background: var(--green-ready); }
    .status-bar.completed { background: var(--text-gray); }
    .order-items { display: flex; flex-direction: column; gap: 12px; }
    .order-item { background: var(--card-white); border: 2px solid var(--border-black); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .item-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .item-name { font-size: 16px; font-weight: 700; color: var(--text-black); }
    .item-price { font-size: 16px; font-weight: 700; color: var(--text-black); }
    .item-unit { font-size: 12px; color: var(--text-gray); margin-top: 2px; }
    .item-notes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .note-tag { display: inline-block; background: var(--card-white); border: 1px solid var(--border-black); padding: 4px 8px; font-size: 11px; font-weight: 500; font-family: Courier New, monospace; }
    .total-section { border-top: 2px solid var(--border-black); padding-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    .total-row { display: flex; justify-content: space-between; align-items: center; }
    .total-label { font-size: 14px; font-weight: 600; color: var(--text-black); text-transform: uppercase; }
    .total-amount { font-size: 32px; font-weight: 900; color: var(--text-black); }
    .notification-btn {
      background: var(--primary-blue);
      border: 3px solid var(--border-black);
      color: #FFF;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: transform 0.1s;
    }
    .notification-btn:active { transform: translate(2px, 2px); }
    .notification-btn.active { background: var(--green-ready); }
    .bell-icon { font-size: 20px; }
    .connection-status { text-align: center; font-size: 12px; padding: 8px; background: var(--green-bg); border: 2px solid var(--border-black); color: var(--text-black); font-weight: 600; }
    .connection-status.offline { background: #FFE5E5; color: var(--red-alert); }
    .footer { text-align: center; font-size: 11px; color: var(--text-gray); margin-top: 16px; }
    .ready-banner { background: var(--green-ready); border: 3px solid var(--border-black); padding: 20px; text-align: center; color: #FFF; font-size: 24px; font-weight: 900; animation: pulse-ready 2s infinite; }
    @keyframes pulse-ready { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    .loading { text-align: center; padding: 40px; font-size: 16px; color: var(--text-gray); }
    .hidden { display: none !important; }
    @media (max-width: 480px) { body { padding: 12px; } .queue-number { font-size: 48px; } .total-amount { font-size: 28px; } }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading" class="loading">Memuat tiket Anda...</div>
    <div id="ticket-content" class="hidden">
      <div id="connection-status" class="connection-status">🟢 Terhubung Real-Time</div>
      <div class="ticket-card">
        <div class="queue-number-box">
          <div id="queue-number" class="queue-number">A000</div>
          <div class="queue-subtitle">Is Your Number</div>
        </div>
        <div id="status-bar" class="status-bar">Sedang Disiapkan</div>
        <div id="ready-banner" class="ready-banner hidden">🔔 PESANAN SIAP DIAMBIL!</div>
        <div id="order-items" class="order-items"></div>
        <div class="total-section">
          <div class="total-row">
            <span class="total-label">Total Akhir</span>
            <span id="total-amount" class="total-amount">Rp 0</span>
          </div>
        </div>
      </div>
      <button id="btn-notification" class="notification-btn">
        <span class="bell-icon">🔔</span>
        <span id="btn-text">HIDUPKAN NOTIFIKASI</span>
      </button>
      <div class="footer">© 2025 Pager F&B Systems. Hak Cipta Dilindungi.</div>
    </div>
  </div>
  <script>
    const urlPath=window.location.pathname;const token=urlPath.split("/t/")[1];if(!token){document.getElementById("loading").textContent="Token tidak valid";throw new Error("No token in URL")}let ticket=null,lastCallCount=0,audioCtx=null,audioUnlocked=false,eventSource=null;const loading=document.getElementById("loading"),ticketContent=document.getElementById("ticket-content"),connectionStatus=document.getElementById("connection-status"),queueNumber=document.getElementById("queue-number"),statusBar=document.getElementById("status-bar"),readyBanner=document.getElementById("ready-banner"),orderItems=document.getElementById("order-items"),totalAmount=document.getElementById("total-amount"),btnNotification=document.getElementById("btn-notification"),btnText=document.getElementById("btn-text");function formatRupiah(a){return"Rp "+a.toLocaleString("id-ID")}function playChime(){if(!audioUnlocked||!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;o.type="sine";g.gain.setValueAtTime(.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.15);o.start(audioCtx.currentTime);o.stop(audioCtx.currentTime+.15)}catch(e){console.error("Chime error:",e)}}function vibrate(){if("vibrate"in navigator)navigator.vibrate([200,100,200])}function renderTicket(d){ticket=d;queueNumber.textContent=ticket.queueNumber;statusBar.classList.remove("ready","completed");if(ticket.status==="preparing"){statusBar.textContent=ticket.orderType==="dine_in"?`Dine In - Meja Nomor ${ticket.tableNo||"-"}`:"Takeaway - Sedang Disiapkan";readyBanner.classList.add("hidden")}else if(ticket.status==="ready"){statusBar.classList.add("ready");statusBar.textContent="✅ SIAP DI PICK-UP BAR";readyBanner.classList.remove("hidden");if(ticket.callCount>lastCallCount){playChime();vibrate();lastCallCount=ticket.callCount}}else if(ticket.status==="completed"){statusBar.classList.add("completed");statusBar.textContent="✔️ Sudah Diambil - Terima Kasih!";readyBanner.classList.add("hidden")}document.title=ticket.status==="ready"?`🔔 PESANAN SIAP! (${ticket.queueNumber})`:`${ticket.queueNumber} - Digital Pager`;orderItems.innerHTML=ticket.items.map(i=>`<div class="order-item"><div class="item-header"><div><div class="item-name">${i.name}</div><div class="item-unit">${formatRupiah(i.price)} / ${i.quantity>1?i.quantity+" pcs":"pcs"}</div></div><div class="item-price">${formatRupiah(i.price*i.quantity)}</div></div>${i.notes?`<div class="item-notes">${i.notes.split(",").map(n=>`<span class="note-tag">${n.trim()}</span>`).join("")}</div>`:""}</div>`).join("");totalAmount.textContent=formatRupiah(ticket.totalAmount);loading.classList.add("hidden");ticketContent.classList.remove("hidden")}function connectSSE(){eventSource=new EventSource(`/api/v1/tickets/${token}/stream`);eventSource.addEventListener("ticket:update",e=>{const d=JSON.parse(e.data);renderTicket(d);connectionStatus.textContent="🟢 Terhubung Real-Time";connectionStatus.classList.remove("offline")});eventSource.onerror=()=>{connectionStatus.textContent="🔴 Terputus - Mencoba Ulang...";connectionStatus.classList.add("offline")}}btnNotification.addEventListener("click",()=>{if(!audioUnlocked){audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioUnlocked=true;playChime();btnNotification.classList.add("active");btnText.textContent="✅ NOTIFIKASI AKTIF"}});fetch(`/api/v1/tickets/${token}`).then(r=>r.json()).then(d=>{if(d.ticket){renderTicket(d.ticket);lastCallCount=d.ticket.callCount;connectSSE()}else{loading.textContent="Tiket tidak ditemukan"}}).catch(e=>{console.error("Fetch error:",e);loading.textContent="Gagal memuat tiket"});window.addEventListener("beforeunload",()=>{if(eventSource)eventSource.close()});
  </script>
</body>
</html>
