<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tiket Pesanan - Digital Pager</title>
  <style>
    :root {
      --bg-cream: #F4F4F0;
      --card-white: #FFFFFF;
      --border-black: #000000;
      --text-black: #0F172A;
      --text-gray: #64748B;
      --primary-blue: #1E60EC;
      --primary-yellow: #FFCC00;
      --green-ready: #10B981;
      --green-bg: #D2F8D2;
      --red-alert: #DC2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-cream);
      color: var(--text-black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: auto 0;
    }

    /* Demo Simulator Switcher */
    .demo-bar {
      background: #FFFFFF;
      border: 2px solid var(--border-black);
      box-shadow: 3px 3px 0 var(--border-black);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .demo-bar-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-gray);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .demo-actions {
      display: flex;
      gap: 6px;
    }
    .demo-btn {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 700;
      border: 2px solid var(--border-black);
      background: #FFFFFF;
      color: var(--text-black);
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--border-black);
      transition: all 0.1s;
    }
    .demo-btn:active, .demo-btn.active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--border-black);
      background: var(--primary-yellow);
    }

    /* Connection Status */
    .connection-status {
      text-align: center;
      font-size: 12px;
      padding: 8px 12px;
      background: var(--green-bg);
      border: 2px solid var(--border-black);
      color: var(--text-black);
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .connection-status.offline {
      background: #FFE5E5;
      color: var(--red-alert);
    }
    .connection-status.demo {
      background: #FFF3C4;
      color: #7A5500;
    }

    /* Ticket Card */
    .ticket-card {
      background: var(--card-white);
      border: 3px solid var(--border-black);
      box-shadow: 5px 5px 0 var(--border-black);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Queue Number Box (Figma Yellow Box) */
    .queue-number-box {
      background: var(--primary-yellow);
      border: 3px solid var(--border-black);
      padding: 24px 16px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    }
    .queue-number {
      font-size: 64px;
      font-weight: 900;
      color: var(--text-black);
      line-height: 1;
      letter-spacing: -0.02em;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    .queue-subtitle {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-black);
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Status Bar */
    .status-bar {
      background: var(--primary-blue);
      border: 3px solid var(--border-black);
      padding: 12px 14px;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 15px;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .status-bar.ready {
      background: var(--green-ready);
    }
    .status-bar.completed {
      background: var(--text-gray);
    }

    /* Ready Banner */
    .ready-banner {
      background: var(--green-ready);
      border: 3px solid var(--border-black);
      padding: 16px;
      text-align: center;
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.02em;
      animation: pulse-ready 1.8s infinite;
    }
    @keyframes pulse-ready {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* Order Items */
    .order-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .order-item {
      background: var(--card-white);
      border: 2px solid var(--border-black);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .item-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-black);
    }
    .item-price {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-black);
      white-space: nowrap;
    }
    .item-unit {
      font-size: 12px;
      color: var(--text-gray);
      margin-top: 2px;
    }
    .item-notes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .note-tag {
      display: inline-block;
      background: #F8FAFC;
      border: 1px solid var(--border-black);
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 600;
      font-family: monospace;
    }

    /* Total Section */
    .total-section {
      border-top: 2px solid var(--border-black);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .total-label {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-black);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .total-amount {
      font-size: 28px;
      font-weight: 900;
      color: var(--text-black);
    }

    /* Notification Button */
    .notification-btn {
      background: var(--primary-blue);
      border: 3px solid var(--border-black);
      box-shadow: 4px 4px 0 var(--border-black);
      color: #FFFFFF;
      padding: 16px 20px;
      font-size: 15px;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.1s;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .notification-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-black);
    }
    .notification-btn.active {
      background: var(--green-ready);
    }
    .bell-icon {
      font-size: 18px;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-gray);
      font-weight: 500;
      margin-top: 4px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Demo / Simulation Switcher (visible in demo mode) -->
    <div id="demo-bar" class="demo-bar hidden">
      <div class="demo-bar-title">
        <span>🎨 Pratinjau Desain Figma (Pelanggan)</span>
        <span style="font-size:10px; color:#1E60EC;">Simulasi</span>
      </div>
      <div class="demo-actions">
        <button class="demo-btn active" id="demo-prep" onclick="setDemoState('preparing')">⏳ Menyiapkan</button>
        <button class="demo-btn" id="demo-ready" onclick="setDemoState('ready')">🔔 Siap Ambil</button>
        <button class="demo-btn" id="demo-comp" onclick="setDemoState('completed')">✔️ Selesai</button>
      </div>
    </div>

    <!-- Connection Status -->
    <div id="connection-status" class="connection-status">
      🟢 Terhubung Real-Time
    </div>

    <!-- Main Ticket Card -->
    <div class="ticket-card">
      <!-- Queue Number Box -->
      <div class="queue-number-box">
        <div id="queue-number" class="queue-number">A001</div>
        <div class="queue-subtitle">Is Your Number</div>
      </div>

      <!-- Status Bar -->
      <div id="status-bar" class="status-bar">
        Sedang Disiapkan
      </div>

      <!-- Ready Banner -->
      <div id="ready-banner" class="ready-banner hidden">
        🔔 PESANAN SIAP DIAMBIL!
      </div>

      <!-- Order Items -->
      <div id="order-items" class="order-items"></div>

      <!-- Total -->
      <div class="total-section">
        <div class="total-row">
          <span class="total-label">Total Akhir</span>
          <span id="total-amount" class="total-amount">Rp 0</span>
        </div>
      </div>
    </div>

    <!-- Notification Button -->
    <button id="btn-notification" class="notification-btn">
      <span class="bell-icon">🔔</span>
      <span id="btn-text">HIDUPKAN NOTIFIKASI SUARA</span>
    </button>

    <!-- Footer -->
    <div class="footer">
      Kedai Kopi Aksiva &bull; Digital Pager System
    </div>
  </div>

  <script>
    const urlPath = window.location.pathname;
    let token = '';
    if (urlPath.includes('/t/')) {
      token = urlPath.split('/t/')[1].replace(/\/$/, '');
    }

    const DEMO_TICKET = {
      queueNumber: 'A001',
      orderType: 'dine_in',
      tableNo: '04',
      status: 'preparing',
      callCount: 0,
      totalAmount: 40000,
      items: [
        { name: 'Americano Ice', price: 18000, quantity: 1, notes: 'Less ice, Normal sugar' },
        { name: 'Es Kopi Susu Gula Aren', price: 22000, quantity: 1, notes: 'Normal ice' }
      ]
    };

    let ticket = null;
    let lastCallCount = 0;
    let audioCtx = null;
    let audioUnlocked = false;
    let eventSource = null;
    let isDemo = false;

    const demoBar = document.getElementById('demo-bar');
    const connectionStatus = document.getElementById('connection-status');
    const queueNumber = document.getElementById('queue-number');
    const statusBar = document.getElementById('status-bar');
    const readyBanner = document.getElementById('ready-banner');
    const orderItems = document.getElementById('order-items');
    const totalAmount = document.getElementById('total-amount');
    const btnNotification = document.getElementById('btn-notification');
    const btnText = document.getElementById('btn-text');

    function formatRupiah(amount) {
      return 'Rp ' + (amount || 0).toLocaleString('id-ID');
    }

    function playChime() {
      if (!audioUnlocked || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (err) {
        console.error('Chime error:', err);
      }
    }

    function vibrate() {
      if ('vibrate' in navigator) {
        try { navigator.vibrate([200, 100, 200]); } catch(e) {}
      }
    }

    function renderTicket(data) {
      ticket = data;
      queueNumber.textContent = ticket.queueNumber || 'A001';
      statusBar.classList.remove('ready', 'completed');

      if (ticket.status === 'preparing') {
        statusBar.textContent = ticket.orderType === 'dine_in'
          ? `Dine In - Meja Nomor ${ticket.tableNo || '-'}`
          : 'Takeaway - Sedang Disiapkan';
        readyBanner.classList.add('hidden');
      } else if (ticket.status === 'ready') {
        statusBar.classList.add('ready');
        statusBar.textContent = '✅ SIAP DI PICK-UP BAR';
        readyBanner.classList.remove('hidden');
        if (ticket.callCount > lastCallCount) {
          playChime();
          vibrate();
          lastCallCount = ticket.callCount;
        }
      } else if (ticket.status === 'completed') {
        statusBar.classList.add('completed');
        statusBar.textContent = '✔️ Sudah Diambil - Terima Kasih!';
        readyBanner.classList.add('hidden');
      }

      document.title = ticket.status === 'ready'
        ? `🔔 PESANAN SIAP! (${ticket.queueNumber})`
        : `${ticket.queueNumber || 'Tiket'} - Digital Pager`;

      const items = ticket.items || [];
      orderItems.innerHTML = items.map(item => `
        <div class="order-item">
          <div class="item-header">
            <div>
              <div class="item-name">${item.name}</div>
              <div class="item-unit">${formatRupiah(item.price || item.unitPrice)} / ${item.quantity > 1 ? item.quantity + ' pcs' : 'pcs'}</div>
            </div>
            <div class="item-price">${formatRupiah((item.price || item.unitPrice) * item.quantity)}</div>
          </div>
          ${item.notes ? `
            <div class="item-notes">
              ${item.notes.split(',').map(n => `<span class="note-tag">${n.trim()}</span>`).join('')}
            </div>
          ` : ''}
        </div>
      `).join('');

      totalAmount.textContent = formatRupiah(ticket.totalAmount || 0);
    }

    window.setDemoState = function(state) {
      document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
      if (state === 'preparing') {
        document.getElementById('demo-prep').classList.add('active');
        DEMO_TICKET.status = 'preparing';
      } else if (state === 'ready') {
        document.getElementById('demo-ready').classList.add('active');
        DEMO_TICKET.status = 'ready';
        DEMO_TICKET.callCount += 1;
      } else if (state === 'completed') {
        document.getElementById('demo-comp').classList.add('active');
        DEMO_TICKET.status = 'completed';
      }
      renderTicket(DEMO_TICKET);
    };

    function startDemoMode(notice) {
      isDemo = true;
      demoBar.classList.remove('hidden');
      connectionStatus.textContent = notice || '🎨 Mode Pratinjau Desain Figma (Interaktif)';
      connectionStatus.className = 'connection-status demo';
      renderTicket(DEMO_TICKET);
    }

    function connectSSE() {
      if (!token) return;
      eventSource = new EventSource(`/api/v1/tickets/${token}/stream`);
      eventSource.addEventListener('ticket:update', (e) => {
        try {
          const data = JSON.parse(e.data);
          renderTicket(data);
          connectionStatus.textContent = '🟢 Terhubung Real-Time';
          connectionStatus.className = 'connection-status';
        } catch(err) {
          console.error(err);
        }
      });
      eventSource.onerror = () => {
        connectionStatus.textContent = '🔴 Terputus - Menghubungkan ulang...';
        connectionStatus.className = 'connection-status offline';
      };
    }

    btnNotification.addEventListener('click', () => {
      if (!audioUnlocked) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioUnlocked = true;
        playChime();
        btnNotification.classList.add('active');
        btnText.textContent = '✅ NOTIFIKASI SUARA AKTIF';
      } else {
        playChime();
      }
    });

    if (!token) {
      startDemoMode('🎨 Mode Pratinjau Desain Figma (Interaktif)');
    } else {
      fetch(`/api/v1/tickets/${token}`)
        .then(res => {
          if (!res.ok) throw new Error('Not found');
          return res.json();
        })
        .then(data => {
          if (data && data.ticket) {
            renderTicket(data.ticket);
            lastCallCount = data.ticket.callCount || 0;
            connectSSE();
          } else {
            startDemoMode('⚠️ Tiket Selesai / Kadaluarsa • Menampilkan Pratinjau');
          }
        })
        .catch(err => {
          console.warn('Live ticket not found, switching to demo mode:', err);
          startDemoMode('⚠️ Tiket Tidak Ditemukan • Menampilkan Pratinjau Figma');
        });
    }

    window.addEventListener('beforeunload', () => {
      if (eventSource) eventSource.close();
    });
  </script>
</body>
</html>
