<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tiket Pesanan - Digital Pager</title>
  <style>
    :root {
      --bg-cream: #F4F4F0;
      --card-white: #FFFFFF;
      --border-black: #000000;
      --text-black: #0F172A;
      --text-gray: #64748B;
      --primary-blue: #1E60EC;
      --primary-yellow: #FFCC00;
      --green-ready: #10B981;
      --green-bg: #D2F8D2;
      --red-alert: #DC2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-cream);
      color: var(--text-black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: auto 0;
    }

    /* Demo Simulator Switcher */
    .demo-bar {
      background: #FFFFFF;
      border: 2px solid var(--border-black);
      box-shadow: 3px 3px 0 var(--border-black);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .demo-bar-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-gray);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .demo-actions {
      display: flex;
      gap: 6px;
    }
    .demo-btn {
      flex: 1;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 800;
      border: 2px solid var(--border-black);
      background: #FFFFFF;
      color: var(--text-black);
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--border-black);
      transition: all 0.1s;
    }
    .demo-btn:active, .demo-btn.active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--border-black);
      background: var(--primary-yellow);
    }

    /* Connection Status */
    .connection-status {
      text-align: center;
      font-size: 12px;
      padding: 8px 12px;
      background: var(--green-bg);
      border: 2px solid var(--border-black);
      color: var(--text-black);
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .connection-status.offline {
      background: #FFE5E5;
      color: var(--red-alert);
    }
    .connection-status.demo {
      background: #FFF3C4;
      color: #7A5500;
    }

    /* Ticket Card */
    .ticket-card {
      background: var(--card-white);
      border: 3px solid var(--border-black);
      box-shadow: 5px 5px 0 var(--border-black);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Queue Number Box (Figma Yellow Box) */
    .queue-number-box {
      background: var(--primary-yellow);
      border: 3px solid var(--border-black);
      padding: 22px 14px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    }
    .queue-number {
      font-size: 64px;
      font-weight: 900;
      color: var(--text-black);
      line-height: 1;
      letter-spacing: -0.02em;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    .queue-subtitle {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-black);
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* Status Bar */
    .status-bar {
      background: var(--primary-blue);
      border: 3px solid var(--border-black);
      padding: 12px 14px;
      color: #FFFFFF;
      font-weight: 800;
      font-size: 15px;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .status-bar.ready {
      background: var(--green-ready);
      color: #FFFFFF;
    }
    .status-bar.completed {
      background: var(--text-gray);
      color: #FFFFFF;
    }

    /* Ready Banner (Blinking Alert) */
    .ready-banner {
      background: var(--green-ready);
      border: 3px solid var(--border-black);
      box-shadow: 3px 3px 0 var(--border-black);
      padding: 16px;
      text-align: center;
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.03em;
      animation: pulse-ready 1.4s infinite;
      cursor: pointer;
    }
    @keyframes pulse-ready {
      0%, 100% { transform: scale(1); background: #10B981; }
      50% { transform: scale(1.02); background: #059669; }
    }

    /* Order Items */
    .order-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .order-item {
      background: var(--card-white);
      border: 2px solid var(--border-black);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .item-name {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-black);
    }
    .item-price {
      font-size: 15px;
      font-weight: 900;
      color: var(--text-black);
      white-space: nowrap;
    }
    .item-unit {
      font-size: 12px;
      color: var(--text-gray);
      margin-top: 2px;
    }
    .item-notes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .note-tag {
      display: inline-block;
      background: #F8FAFC;
      border: 1px solid var(--border-black);
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 700;
      font-family: monospace;
    }

    /* Total Section */
    .total-section {
      border-top: 2px solid var(--border-black);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .total-label {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-black);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .total-amount {
      font-size: 26px;
      font-weight: 900;
      color: var(--text-black);
    }

    /* Notification / Audio Button */
    .notification-btn {
      background: var(--primary-yellow);
      border: 3px solid var(--border-black);
      box-shadow: 4px 4px 0 var(--border-black);
      color: var(--text-black);
      padding: 16px 20px;
      font-size: 15px;
      font-weight: 900;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.1s;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      user-select: none;
    }
    .notification-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-black);
    }
    .notification-btn.active {
      background: #FFFFFF;
      color: var(--text-black);
      border-color: var(--border-black);
    }
    .bell-icon {
      font-size: 20px;
      display: inline-block;
      animation: bell-swing 2s infinite ease-in-out;
    }
    .notification-btn.active .bell-icon {
      animation: none;
    }
    @keyframes bell-swing {
      0%, 100% { transform: rotate(0); }
      20% { transform: rotate(15deg); }
      40% { transform: rotate(-15deg); }
      60% { transform: rotate(10deg); }
      80% { transform: rotate(-10deg); }
    }

    /* Audio visual indicator bar */
    .sound-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-gray);
      font-weight: 600;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-gray);
      font-weight: 600;
      margin-top: 4px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Preloaded Audio Elements for maximum browser compatibility -->
  <audio id="pager-audio" src="/chime.mp3" preload="auto" playsinline></audio>

  <div class="container">
    <!-- Demo / Simulation Switcher (visible in demo mode) -->
    <div id="demo-bar" class="demo-bar hidden">
      <div class="demo-bar-title">
        <span>🎨 Pratinjau Desain Figma (Pelanggan)</span>
        <span style="font-size:10px; color:#1E60EC; font-weight:800;">Simulasi</span>
      </div>
      <div class="demo-actions">
        <button class="demo-btn active" id="demo-prep" onclick="setDemoState('preparing')">⏳ Menyiapkan</button>
        <button class="demo-btn" id="demo-ready" onclick="setDemoState('ready')">🔔 Siap Ambil</button>
        <button class="demo-btn" id="demo-comp" onclick="setDemoState('completed')">✔️ Selesai</button>
      </div>
    </div>

    <!-- Connection Status -->
    <div id="connection-status" class="connection-status">
      🟢 Terhubung Real-Time
    </div>

    <!-- Main Ticket Card -->
    <div class="ticket-card">
      <!-- Queue Number Box -->
      <div class="queue-number-box">
        <div id="queue-number" class="queue-number">A001</div>
        <div class="queue-subtitle">Is Your Number</div>
      </div>

      <!-- Status Bar -->
      <div id="status-bar" class="status-bar">
        Sedang Disiapkan
      </div>

      <!-- Ready Banner -->
      <div id="ready-banner" class="ready-banner hidden" onclick="triggerPagerAlert()">
        🔔 PESANAN SIAP DIAMBIL! (KLIK)
      </div>

      <!-- Order Items -->
      <div id="order-items" class="order-items"></div>

      <!-- Total -->
      <div class="total-section">
        <div class="total-row">
          <span class="total-label">Total Akhir</span>
          <span id="total-amount" class="total-amount">Rp 0</span>
        </div>
      </div>
    </div>

    <!-- Notification Button -->
    <button id="btn-notification" class="notification-btn" onclick="handleSoundButtonClick()">
      <span class="bell-icon" id="bell-icon">🔔</span>
      <span id="btn-text">🔔 KLIK DI SINI: AKTIFKAN & TES SUARA PAGER</span>
    </button>
    <div id="sound-hint" class="sound-hint" style="color:#DC2626; font-weight:700;">⚠️ Klik tombol kuning di atas agar browser mengizinkan suara + pastikan HP tidak di-silent</div>

    <!-- Footer -->
    <div class="footer">
      Kedai Kopi Aksiva &bull; Digital Pager System
    </div>
  </div>

  <script>
    // URL parsing: support /t/:token or direct /pelanggan /ticket
    const urlPath = window.location.pathname;
    let token = '';
    if (urlPath.includes('/t/')) {
      token = urlPath.split('/t/')[1].replace(/\/$/, '');
    }

    const DEMO_TICKET = {
      queueNumber: 'A001',
      orderType: 'dine_in',
      tableNo: '04',
      status: 'preparing',
      callCount: 0,
      totalAmount: 40000,
      items: [
        { name: 'Americano Ice', price: 18000, quantity: 1, notes: 'Less ice, Normal sugar' },
        { name: 'Es Kopi Susu Gula Aren', price: 22000, quantity: 1, notes: 'Normal ice' }
      ]
    };

    let ticket = null;
    let lastCallCount = 0;
    let audioUnlocked = false;
    let audioCtx = null;
    let eventSource = null;
    let reminderTimer = null;

    // Elements
    const audioEl = document.getElementById('pager-audio');
    const demoBar = document.getElementById('demo-bar');
    const connectionStatus = document.getElementById('connection-status');
    const queueNumber = document.getElementById('queue-number');
    const statusBar = document.getElementById('status-bar');
    const readyBanner = document.getElementById('ready-banner');
    const orderItems = document.getElementById('order-items');
    const totalAmount = document.getElementById('total-amount');
    const btnNotification = document.getElementById('btn-notification');
    const btnText = document.getElementById('btn-text');
    const bellIcon = document.getElementById('bell-icon');
    const soundHint = document.getElementById('sound-hint');

    function formatRupiah(amount) {
      return 'Rp ' + (amount || 0).toLocaleString('id-ID');
    }

    // ==========================================
    // AUDIO ENGINE (Web Audio API + Audio File Fallback)
    // ==========================================
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Synthesize rich dual-tone pager chime
    function synthesizePagerChime() {
      const ctx = getAudioContext();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        function ringTone(freq, startOffset, duration, vol) {
          // Fundamental sine wave
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(freq, now + startOffset);
          gain1.gain.setValueAtTime(vol * 0.7, now + startOffset);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + startOffset + duration);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now + startOffset);
          osc1.stop(now + startOffset + duration);

          // Harmonic triangle overtone (bright bell ring)
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(freq * 2, now + startOffset);
          gain2.gain.setValueAtTime(vol * 0.3, now + startOffset);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + startOffset + (duration * 0.7));
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + startOffset);
          osc2.stop(now + startOffset + duration);
        }

        // Phrase 1: Ding (880Hz A5) -> Dong (1174Hz D6)
        ringTone(880, 0.00, 0.35, 0.85);
        ringTone(1174.66, 0.18, 0.45, 0.95);

        // Phrase 2: Ding -> Dong (repeat after 0.6s)
        ringTone(880, 0.65, 0.35, 0.85);
        ringTone(1174.66, 0.83, 0.55, 0.95);
      } catch (err) {
        console.warn('Web Audio synthesis error:', err);
      }
    }

    // Play chime via Audio element or Web Audio synthesizer
    function playPagerChime() {
      let played = false;

      // 1. Try HTML5 Audio element (/chime.wav)
      if (audioEl) {
        try {
          audioEl.currentTime = 0;
          const promise = audioEl.play();
          if (promise !== undefined) {
            promise.then(() => {
              played = true;
            }).catch(e => {
              console.warn('Audio tag play blocked/failed, using synthesizer:', e);
              synthesizePagerChime();
            });
          }
        } catch(e) {
          synthesizePagerChime();
        }
      }

      // 2. Also run synthesizer for maximum presence & volume
      synthesizePagerChime();

      // 3. Vibration
      if ('vibrate' in navigator) {
        try {
          navigator.vibrate([300, 150, 300, 150, 500]);
        } catch(e) {}
      }
    }

    // Unlock audio on ANY user touch/click on page
    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;

      // Warm up Web Audio
      const ctx = getAudioContext();
      if (ctx) {
        try {
          const buffer = ctx.createBuffer(1, 1, 22050);
          const source = ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(ctx.destination);
          source.start(0);
        } catch(e) {}
      }

      // Warm up HTML5 Audio
      if (audioEl) {
        audioEl.play().then(() => {
          audioEl.pause();
          audioEl.currentTime = 0;
        }).catch(() => {});
      }

      // Update button UI
      btnNotification.classList.add('active');
      btnText.textContent = '🔊 SUARA AKTIF • KLIK UNTUK TES';
      bellIcon.textContent = '🔊';
      soundHint.textContent = '✅ Notifikasi suara sudah aktif. Klik tombol untuk tes dengar bunyi pager.';
    }

    // Button handler: unlock & play sound immediately for testing
    window.handleSoundButtonClick = function() {
      unlockAudio();
      playPagerChime();
    };

    // Ready banner click handler
    window.triggerPagerAlert = function() {
      unlockAudio();
      playPagerChime();
    };

    // Auto unlock on first user gesture anywhere on screen
    ['click', 'touchstart', 'pointerdown', 'keydown'].forEach(evt => {
      document.addEventListener(evt, () => {
        unlockAudio();
      }, { once: true, passive: true });
    });

    // ==========================================
    // TICKET RENDERING
    // ==========================================
    function renderTicket(data) {
      ticket = data;
      queueNumber.textContent = ticket.queueNumber || 'A001';
      statusBar.classList.remove('ready', 'completed');

      // Clear reminder if status is not ready
      if (ticket.status !== 'ready' && reminderTimer) {
        clearInterval(reminderTimer);
        reminderTimer = null;
      }

      if (ticket.status === 'preparing') {
        statusBar.textContent = ticket.orderType === 'dine_in'
          ? `Dine In - Meja Nomor ${ticket.tableNo || '-'}`
          : 'Takeaway - Sedang Disiapkan';
        readyBanner.classList.add('hidden');
      } else if (ticket.status === 'ready') {
        statusBar.classList.add('ready');
        statusBar.textContent = '✅ SIAP DI PICK-UP BAR';
        readyBanner.classList.remove('hidden');

        // Play chime whenever called or entering ready state
        playPagerChime();

        // Start repeating reminder every 15s if customer hasn't taken it
        if (!reminderTimer) {
          reminderTimer = setInterval(() => {
            if (ticket && ticket.status === 'ready') {
              playPagerChime();
            }
          }, 15000);
        }
      } else if (ticket.status === 'completed') {
        statusBar.classList.add('completed');
        statusBar.textContent = '✔️ Sudah Diambil - Terima Kasih!';
        readyBanner.classList.add('hidden');
      }

      document.title = ticket.status === 'ready'
        ? `🔔 PESANAN SIAP! (${ticket.queueNumber})`
        : `${ticket.queueNumber || 'Tiket'} - Digital Pager`;

      const items = ticket.items || [];
      orderItems.innerHTML = items.map(item => `
        <div class="order-item">
          <div class="item-header">
            <div>
              <div class="item-name">${item.name}</div>
              <div class="item-unit">${formatRupiah(item.price || item.unitPrice)} / ${item.quantity > 1 ? item.quantity + ' pcs' : 'pcs'}</div>
            </div>
            <div class="item-price">${formatRupiah((item.price || item.unitPrice) * item.quantity)}</div>
          </div>
          ${item.notes ? `
            <div class="item-notes">
              ${item.notes.split(',').map(n => `<span class="note-tag">${n.trim()}</span>`).join('')}
            </div>
          ` : ''}
        </div>
      `).join('');

      totalAmount.textContent = formatRupiah(ticket.totalAmount || 0);
    }

    // ==========================================
    // DEMO / SIMULATION SWITCHER
    // ==========================================
    window.setDemoState = function(state) {
      // User gesture: unlock audio immediately
      unlockAudio();

      document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
      if (state === 'preparing') {
        document.getElementById('demo-prep').classList.add('active');
        DEMO_TICKET.status = 'preparing';
      } else if (state === 'ready') {
        document.getElementById('demo-ready').classList.add('active');
        DEMO_TICKET.status = 'ready';
        DEMO_TICKET.callCount += 1;
      } else if (state === 'completed') {
        document.getElementById('demo-comp').classList.add('active');
        DEMO_TICKET.status = 'completed';
      }
      renderTicket(DEMO_TICKET);
    };

    function startDemoMode(notice) {
      demoBar.classList.remove('hidden');
      connectionStatus.textContent = notice || '🎨 Mode Pratinjau Desain Figma (Interaktif)';
      connectionStatus.className = 'connection-status demo';
      renderTicket(DEMO_TICKET);
    }

    // ==========================================
    // REALTIME SSE CONNECTION & POLLING BACKUP
    // ==========================================
    let pollTimer = null;

    function handleTicketData(newTicket) {
      if (!newTicket) return;
      const prevStatus = ticket ? ticket.status : null;
      const prevCallCount = lastCallCount || 0;
      const newCallCount = newTicket.callCount || 0;

      // Detect if cashier called the order
      const isCallTriggered = (
        (newTicket.status === 'ready' && prevStatus !== 'ready') ||
        (newTicket.status === 'ready' && newCallCount > prevCallCount)
      );

      lastCallCount = newCallCount;
      renderTicket(newTicket);

      if (isCallTriggered) {
        console.log('🔔 Staff called ticket! Triggering chime & alerts...');
        playPagerChime();
      }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        if (!token) return;
        try {
          const res = await fetch(`/api/v1/tickets/${token}`);
          if (res.ok) {
            const data = await res.json();
            if (data && data.ticket) {
              handleTicketData(data.ticket);
            }
          }
        } catch(e) {
          // ignore network glitch
        }
      }, 2500);
    }

    function connectSSE() {
      if (!token) return;
      if (eventSource) {
        try { eventSource.close(); } catch(e) {}
      }

      try {
        eventSource = new EventSource(`/api/v1/tickets/${token}/stream`);

        const handleIncoming = (e) => {
          try {
            const data = JSON.parse(e.data);
            handleTicketData(data);
            connectionStatus.textContent = '🟢 Terhubung Real-Time (Live)';
            connectionStatus.className = 'connection-status';
          } catch(err) {
            console.error('SSE JSON error:', err);
          }
        };

        // Support both underscore and colon SSE event formats
        eventSource.addEventListener('ticket_update', handleIncoming);
        eventSource.addEventListener('ticket:update', handleIncoming);
        eventSource.addEventListener('ticket_sync', handleIncoming);
        eventSource.onmessage = handleIncoming;

        eventSource.onopen = () => {
          connectionStatus.textContent = '🟢 Terhubung Real-Time (Live)';
          connectionStatus.className = 'connection-status';
        };

        eventSource.onerror = () => {
          connectionStatus.textContent = '🟡 Mode Backup Polling Aktif';
          connectionStatus.className = 'connection-status';
        };
      } catch(err) {
        console.warn('SSE not supported or blocked, relying on polling:', err);
      }

      startPolling();
    }

    function loadLiveTicket(tkn) {
      demoBar.classList.add('hidden');
      fetch(`/api/v1/tickets/${tkn}`)
        .then(res => {
          if (!res.ok) throw new Error('Not found');
          return res.json();
        })
        .then(data => {
          if (data && data.ticket) {
            token = tkn;
            lastCallCount = data.ticket.callCount || 0;
            renderTicket(data.ticket);
            connectSSE();
          } else {
            startDemoMode('⚠️ Tiket Selesai / Kadaluarsa • Menampilkan Pratinjau');
          }
        })
        .catch(err => {
          console.warn('Live ticket not found, switching to demo mode:', err);
          startDemoMode('⚠️ Tiket Tidak Ditemukan • Menampilkan Pratinjau Figma');
        });
    }

    // Re-check state when mobile screen unlocks or browser tab regains focus
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && token) {
        fetch(`/api/v1/tickets/${token}`)
          .then(r => r.json())
          .then(d => { if (d && d.ticket) handleTicketData(d.ticket); })
          .catch(() => {});
        if (!eventSource || eventSource.readyState === EventSource.CLOSED) {
          connectSSE();
        }
      }
    });

    // Auto-detect token from URL or find latest active order
    async function initPage() {
      // 1. Check if token in URL
      const path = window.location.pathname;
      const params = new URLSearchParams(window.location.search);
      let foundToken = params.get('token') || params.get('t');

      if (!foundToken && path.includes('/t/')) {
        foundToken = path.split('/t/')[1].split('/')[0].split('?')[0].trim();
      }

      if (foundToken) {
        token = foundToken;
        loadLiveTicket(token);
        return;
      }

      // 2. If no token in URL, check if there is an active order in store
      try {
        const res = await fetch('/api/v1/queue/active');
        if (res.ok) {
          const data = await res.json();
          if (data && data.activeTickets && data.activeTickets.length > 0) {
            // Pick newest active ticket
            const newest = data.activeTickets[data.activeTickets.length - 1];
            token = newest.token;
            console.log('Auto-connected to latest active ticket:', token, newest.queueNumber);
            window.history.replaceState({}, '', `/t/${token}`);
            loadLiveTicket(token);
            return;
          }
        }
      } catch(e) {
        console.warn('Auto-find active ticket failed:', e);
      }

      // 3. Fallback to interactive demo mode
      startDemoMode('🎨 Mode Pratinjau Desain Figma (Interaktif)');
    }

    initPage();

    window.addEventListener('beforeunload', () => {
      if (eventSource) eventSource.close();
      if (reminderTimer) clearInterval(reminderTimer);
    });
  </script>
</body>
</html>
